services:
  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile.reference
    ports:
      - "8001:8001"
    networks:
      - app-net

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile.reference
    ports:
      - "8002:8002"
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8001
    depends_on:
      - product-service
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
